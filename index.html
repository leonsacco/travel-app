<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>My world map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <div>
                <h1>My world map</h1>
                <div class="sub" id="total"></div>
            </div>
            <div class="tools">
                <input id="q" list="names" placeholder="Find a country" aria-label="Find a country">
                <datalist id="names"></datalist>
                <button id="reset">Clear all</button>
            </div>
        </header>
        <div class="modes" id="modes" role="group" aria-label="Marking colour"></div>
        <div class="map">
            <svg id="svg" viewBox="0 0 960 500" role="img" aria-label="World map">
                <rect width="960" height="500" fill="none" />
                <g id="g"></g>
            </svg>
            <div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo"
                    aria-label="Zoom out">&minus;</button></div>
            <div class="hint" id="hint">Pick a colour, then tap a country</div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
